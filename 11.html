<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<title>qq</title>
</head>
<body>
<h1>ToDo</h1>
<button id="create">create new</button>
<ul>
	<li data-done="false"><span>Сходить в магазин</span> <button onclick="deleteItem(this)">Удалить</button> <button onclick="setStatus(this)">Отметить</button></li>
	<li data-done="false"><span>Убраться</span> <button onclick="deleteItem(this)">Удалить</button> <button onclick="setStatus(this)">Отметить</button></li>
	<li data-done="false"><span>Заплатить за квартиру</span> <button onclick="deleteItem(this)">Удалить</button> <button onclick="setStatus(this)">Отметить</button></li>
</ul>
<script>
let ul = document.querySelector('ul');
create.addEventListener("click" , () => ul.innerHTML += '<li data-done="false"><span>Еще дела</span> <button onclick="deleteItem(this)">Удалить</button> <button onclick="setStatus(this)">Отметить</button></li>');
function deleteItem(element){
    element.closest('li').remove();
}
function setStatus(element){
    let li = element.closest('li');
    if (li.dataset.done === "false"){
        li.dataset.done = "true";
        li.querySelector('span').style.textDecoration = "line-through";
    } else {
        li.dataset.done = "false";
        li.querySelector('span').style.textDecoration = "none";
    }
}
</script>
</body>
</html>
